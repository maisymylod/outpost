apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "outpost.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outpost.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "outpost.fullname" . }}-operator
  labels:
    {{- include "outpost.labels" . | nindent 4 }}
rules:
  - apiGroups: ["outpost.dev"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["outpost.dev"]
    resources: ["workloads/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "outpost.fullname" . }}-operator
  labels:
    {{- include "outpost.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "outpost.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "outpost.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
