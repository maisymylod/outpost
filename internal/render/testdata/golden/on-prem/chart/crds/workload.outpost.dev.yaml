apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloads.outpost.dev
spec:
  group: outpost.dev
  scope: Namespaced
  names:
    kind: Workload
    listKind: WorkloadList
    plural: workloads
    singular: workload
    shortNames:
      - wl
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: GPUs
          type: integer
          jsonPath: .spec.gpu.count
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - image
                - replicas
                - gpu
                - resources
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                command:
                  type: array
                  items:
                    type: string
                args:
                  type: array
                  items:
                    type: string
                gpu:
                  type: object
                  required:
                    - count
                    - class
                  properties:
                    count:
                      type: integer
                      minimum: 1
                    class:
                      type: string
                    interconnect:
                      type: object
                      properties:
                        nccl:
                          type: boolean
                        infiniband:
                          type: boolean
                resources:
                  type: object
                  required:
                    - cpu
                    - memory
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    hugepages:
                      type: string
                env:
                  type: object
                  additionalProperties:
                    type: string
                ports:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - port
                    properties:
                      name:
                        type: string
                      port:
                        type: integer
            status:
              type: object
              properties:
                observedReplicas:
                  type: integer
                ready:
                  type: boolean
