apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "outpost.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outpost.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "outpost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "outpost.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "outpost.fullname" . }}-operator
      containers:
        - name: operator
          image: {{ .Values.operator.image | quote }}
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
